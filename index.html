<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'></polygon><polyline points='2 17 12 22 22 17'></polyline><polyline points='2 12 12 17 22 12'></polyline></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rahil Mirza — Developer Portfolio | Computer & Data Science</title>
    <meta name="description" content="Portfolio of Rahil Mirza, B.Tech Computer & Data Science student at R. C. Patel Institute of Technology (Class of 2029). Still learning. Always building. Becoming better." />
    <meta name="author" content="Rahil Mirza" />
    <meta name="theme-color" content="#080a10" />

    <!-- Instant Theme Initializer: Default dark mode to avoid theme flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('rahil_portfolio_theme');
          var theme = saved || 'dark';
          var root = document.documentElement;
          if (theme === 'light') {
            root.classList.add('light', 'light-mode');
            root.classList.remove('dark', 'dark-mode');
            root.style.colorScheme = 'light';
          } else {
            root.classList.add('dark', 'dark-mode');
            root.classList.remove('light', 'light-mode');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rahil Mirza — The Interactive Developer Experience" />
    <meta property="og:description" content="B.Tech Computer & Data Science student (Class of 2029). Explore interactive projects, live portals, and technical architecture." />
